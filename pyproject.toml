[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisemaker-cpu"
version = "0.0.0"
description = "CPU Noisemaker shader engine — Python port of noisemaker-cpu (GLSL-transpiled)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Build-time only: the transpiler (transpiler/) fetches + parses CDN shader
# bundles. Not required at runtime.
build = ["json5>=0.9"]

[project.scripts]
noisemaker-cpu = "noisemaker_cpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
